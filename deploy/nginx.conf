# Musica —— 静态 SPA 的 Nginx 配置（容器内默认：监听 80，root 为镜像内路径）。
#
# 直接装在宿主机上时，只需改三行：
#   - listen 80;           （HTTPS 由 certbot --nginx 自动补全 443 配置）
#   - server_name musica.example.com;
#   - root /var/www/musica;
#
# 本配置假定站点部署在域名根目录。若部署在子路径（DEPLOY_BASE=/musica/），
# 需要把 root 指到 /var/www 并让请求路径带 /musica/ 前缀，或改用单独的反代改写。
#
# 三条硬性要求（对应 docs/technical-design.md 第 17 节）：
#   1. 路由深链（/songs/practice-001）回退到 index.html；
#   2. 静态资源缺失必须返回真 404，绝不能把 index.html 当乐谱/Worker 喂给前端；
#   3. 构建产物带内容哈希可长缓存，清单与曲谱短缓存。
#
# 注意：曲库里存在与前端路由同名的真实目录（/songs/practice-001/ 里是乐谱），
# 直接交给 try_files 会命中目录并 301 到带斜杠的路径，随后 403。所以 /songs
# 与 /songs/<id> 必须显式返回应用入口，不能走通用回退。

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml text/xml;

    # 1) 带哈希的构建产物：内容变则文件名变，可永久缓存。
    #    ^~ 让前缀匹配优先于下面的扩展名正则，避免字体等被降级成短缓存。
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 2) 字库与音色（alphaTab 构建期拷贝）：体积大，缓存一个月
    location ~* ^/(font|soundfont)/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000";
    }

    # 3) 曲库数据：必须命中真实文件，缺失返回 404 而不是 HTML
    location ~* \.(json|musicxml|xml|sf2|sf3|woff2?|otf|eot|ttf)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300";
    }

    # 4) 前端路由 /songs 与 /songs/<id>：磁盘上有同名目录，显式返回应用入口。
    #    必须放在第 3 条之后：/songs/index.json 应先被数据文件规则命中。
    location ~ ^/songs(/[^/]+)?/?$ {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # 5) 其余全部走 SPA 回退；HTML 不缓存，保证发版后立刻生效
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
